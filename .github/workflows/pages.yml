name: Pages

# Builds site/ with Vite and publishes dist/. Every check runs before upload, so
# a red run leaves the last good site live: the Python tests (the published data
# and its guards), the build, check_dist.mjs (hashed code, data copied intact)
# and the browser check on the built site. npm ci verifies every library against
# the lockfile's checksums, which replaced the vendored SHA256SUMS.

on:
  push:
    branches: [master]
    paths: ['site/**', 'package.json', 'package-lock.json', 'vite.config.js', 'playwright.config.js', 'smoke/**', 'scripts/check_dist.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # tests/test_loaded_path.py reads git history

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Run tests
        run: |
          pip install -r requirements-ci.txt
          python -m pytest tests/ -q

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install site dependencies and the test browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the site
        run: npm run build

      - name: Check the built site
        run: npm run check:dist

      - name: Browser check on the built site
        run: npm run smoke

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
